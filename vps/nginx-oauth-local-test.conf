# Local SSH tunnel only. Keep out of the public nginx configuration.
server {
    listen 127.0.0.1:18093;
    server_name localhost;
    root /opt/fauxlore-postgrest-preview;
    index index.html;
    access_log off;
    client_max_body_size 6m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    if ($host != localhost) { return 403; }
    location /auth/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host localhost:18093;
    }
    location /api/rpc/ {
        if ($http_origin != "http://localhost:18093") { return 403; }
        proxy_pass http://127.0.0.1:18086;
        proxy_set_header Origin "https://sixiemeterre.ru";
        proxy_read_timeout 60s;
    }
    location /api/projection/ {
        if ($http_origin != "http://localhost:18093") { return 403; }
        proxy_pass http://127.0.0.1:18083;
        proxy_set_header Origin "https://sixiemeterre.ru";
        proxy_read_timeout 60s;
    }
    location / { try_files $uri $uri/ =404; }
}
