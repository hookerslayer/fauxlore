# Prepared candidate only. Save as a disabled site in sites-available until stages E?F are approved complete.
server {
    listen 80;
    server_name sixiemeterre.ru www.sixiemeterre.ru;
    return 301 https://sixiemeterre.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name www.sixiemeterre.ru;
    ssl_certificate /etc/letsencrypt/live/sixiemeterre.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sixiemeterre.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    return 301 https://sixiemeterre.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name sixiemeterre.ru;
    root /opt/fauxlore/releases/candidate-20261103;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/sixiemeterre.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sixiemeterre.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 6m;
    server_tokens off;

    location = /CANDIDATE-NOT-LIVE.txt {
        return 404;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:18181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_cache off;
        access_log off;
    }

    location ^~ /api/rpc/ {
        proxy_pass http://127.0.0.1:18186;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering on;
    }

    location ^~ /api/projection/ {
        proxy_pass http://127.0.0.1:18183;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
